<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rehearse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one question per screen, studio "on air" bar on top, transcript below */
:root{--bg:#f7f6f3;--fg:#1d1c1a;--mute:#6b6862;--line:#dcd8d0;--card:#fff;--air:#c62828;--ok:#2e7d32;--warn:#b26a00;
--q:"Source Serif 4",Georgia,serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#171615;--fg:#f1efea;--mute:#a7a39b;--line:#34322e;--card:#211f1d;--air:#ff5a4f;--ok:#7bc67e;--warn:#ffb74d;color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font:22px/1.5 var(--body);margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-inline:24px;padding-block:20px 60px;display:grid;gap:22px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:18px;color:var(--mute)}
.onair{font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:6px;border:2px solid var(--line);color:var(--mute)}
.rec .onair{border-color:var(--air);color:var(--air)}
.timer{font-variant-numeric:tabular-nums;font-size:28px;color:var(--fg);font-weight:700}
.meter{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--ok)}
h1{font:600 clamp(30px,4.2vw,46px)/1.25 var(--q);margin:0;text-wrap:balance}
.btns{display:flex;flex-wrap:wrap;gap:12px}
button{font:700 20px var(--body);padding:12px 22px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:focus-visible{outline:3px solid var(--air);outline-offset:2px}
#rec{background:var(--air);border-color:var(--air);color:#fff}
.rec #rec{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;min-width:0}
.label{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:6px}
#tx{font-size:24px;min-height:3em;white-space:pre-wrap}#tx .interim{color:var(--mute)}
#ans{font-size:21px;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat b{display:block;font-size:30px;font-variant-numeric:tabular-nums}.stat span{font-size:16px;color:var(--mute)}
.good{color:var(--ok)}.warn{color:var(--warn)}
.keys{font-size:15px;color:var(--mute)}
</style></head><body>
<div class="wrap" id="app">
 <div class="bar"><a href="/" style="color:inherit">← All sessions</a><span id="topic"></span><span id="pos"></span><span class="onair">On air</span><span class="timer" id="timer">0:00</span><div class="meter"><i id="lvl"></i></div></div>
 <h1 id="q">Loading questions…</h1>
 <div class="btns"><button id="prev">← Previous</button><button id="rec">● Record answer</button><button id="next">Next →</button><button id="show">Show my notes</button></div>
 <div class="box"><div class="label">What you said</div><div id="tx">Press Record and answer aloud. Your words appear here.</div></div>
 <div class="box" id="gradebox" hidden><div class="label">Coach's grade</div><div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap"><div id="grade" style="font:600 64px/1 var(--q);min-width:1.6em">…</div><div id="gradetxt" style="flex:1;min-width:0;font-size:22px"></div></div></div>
 <div class="box" id="statbox" hidden><div class="label">This take</div><div class="stats" id="stats"></div><p id="note" style="margin:12px 0 0;font-size:18px;color:var(--mute)"></p></div>
 <div class="box" id="ansbox" hidden><div class="label">Your notes</div><div id="ans"></div></div>
 <div class="keys">Keys: Space records or stops · ← → change question · A shows your notes. Every take is saved in your talk rehersals folder.</div>
</div>
<script>
let Q=[],i=0,recOn=false,t0=0,tick,mr,chunks=[],sr,finalTx="",stream,ctx,an,raf;
const $=id=>document.getElementById(id);
const SID=encodeURIComponent(new URLSearchParams(location.search).get("s"));
fetch("/api/session?s="+SID).then(r=>r.json()).then(d=>{if(d.error){$("q").textContent="Session not found. Go back to all sessions.";return}Q=d.questions;document.title=d.topic+" · Rehearse";$("topic").textContent=d.id+" · "+d.topic;show()});
function show(){const x=Q[i];$("rec").textContent="● Record answer";$("pos").textContent=`Question ${i+1} of ${Q.length} · notes ${x.a?x.a.split(/\s+/).length+" words":"not given"}`;$("q").textContent=x.q;$("ans").textContent=x.a;$("ansbox").hidden=true;$("show").textContent="Show my notes";$("tx").textContent="Press Record and answer aloud. Your words appear here.";$("statbox").hidden=true;$("gradebox").hidden=true;$("timer").textContent="0:00"}
function go(d){if(recOn)return;i=Math.max(0,Math.min(Q.length-1,i+d));show()}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("show").onclick=()=>{const h=$("ansbox").hidden;$("ansbox").hidden=!h;$("show").textContent=h?"Hide my notes":"Show my notes"};
$("rec").onclick=()=>recOn?stop():start();
addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON"&&e.key===" ")e.preventDefault();if(e.key===" "){e.preventDefault();$("rec").click()}if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);if(e.key.toLowerCase()==="a")$("show").click()});
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
async function start(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$("tx").textContent="Microphone blocked. Allow it in Chrome's address bar, then try again.";return}
 recOn=true;document.body.classList.add("rec");$("rec").textContent="■ Stop";finalTx="";$("statbox").hidden=true;$("tx").textContent="Listening…";
 chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=e=>chunks.push(e.data);mr.start();
 ctx=new AudioContext();an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);const buf=new Float32Array(an.fftSize);
 t0=performance.now();tick=setInterval(()=>$("timer").textContent=fmt((performance.now()-t0)/1000),250);
 (function loop(){an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const rms=Math.sqrt(s/buf.length);
  $("lvl").style.width=Math.min(100,rms*600)+"%";
  raf=requestAnimationFrame(loop)})();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){sr=new SR();sr.lang="en-US";sr.continuous=true;sr.interimResults=true;
  sr.onresult=e=>{let interim="";for(let k=e.resultIndex;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)finalTx+=r[0].transcript.trim()+" ";else interim+=r[0].transcript}$("tx").innerHTML="";$("tx").append(finalTx);const s=document.createElement("span");s.className="interim";s.textContent=interim;$("tx").append(s)};
  sr.onend=()=>{if(recOn)try{sr.start()}catch(e){}};sr.start()}
 else $("tx").textContent="Live transcript needs Chrome. Audio is still being recorded.";
}
function stop(){
 recOn=false;document.body.classList.remove("rec");$("rec").textContent="● Record again";clearInterval(tick);cancelAnimationFrame(raf);$("lvl").style.width="0";
 try{sr&&sr.stop()}catch(e){}
 mr.onstop=()=>{const blob=new Blob(chunks,{type:"audio/webm"});stream.getTracks().forEach(t=>t.stop());ctx.close();
  $("gradebox").hidden=false;$("grade").textContent="…";$("gradetxt").textContent="Transcribing…";
  const qn=i+1,add=(k,v)=>{const p=document.createElement("p");const b=document.createElement("b");b.textContent=k;p.append(b," ",v);$("gradetxt").append(p)};
  fetch(`/audio?s=${SID}&q=${qn}`,{method:"POST",body:blob}).then(r=>r.json()).then(t=>{if(i+1!==qn)return;
   if(t.error){$("grade").textContent="?";$("gradetxt").textContent="Transcription failed: "+t.error;return}
   $("tx").textContent=t.transcript||"(nothing heard)";stats(t.metrics);
   if(t.skipped){$("grade").textContent="–";$("gradetxt").textContent=`Not graded: under 5 words (${t.metrics.words||0} heard).`;return}
   $("gradetxt").textContent="Grading…";
   const poll=()=>fetch(`/grade?s=${SID}&id=${t.id}`).then(r=>r.json()).then(g=>{if(i+1!==qn)return;if(g.pending)return setTimeout(poll,1000);
    $("gradetxt").innerHTML="";if(g.error){$("grade").textContent="?";add("Grading failed:",g.error);return}
    $("grade").textContent=g.grade;add("Next take:",g.recommendation);add("Fluency:",g.fluency);add("Coherence:",g.coherence)});
   poll();
  }).catch(()=>{$("grade").textContent="?";$("gradetxt").textContent="Couldn't reach the grading server."})};mr.stop();
}
// The numbers come from Whisper's transcript, the same one the grader reads (Chrome's live transcript drops fillers)
function stats(m){
 const tile=(v,label,warn)=>`<div class="stat"><b class="${warn?"warn":"good"}">${v}</b><span>${label}</span></div>`,fw=m.filler_words||{};
 $("stats").innerHTML=(m.words||0)<5?tile(m.words||0,"words heard (5 needed for a grade)",true):
  tile(fmt(m.seconds),"length (aim 0:45 to 2:00)",m.seconds<45||m.seconds>120)+tile(m.wpm,"words per minute (aim 130 to 160)",m.wpm<130||m.wpm>160)+
  tile(m.fillers,`fillers, ${m.fillers_per_100w} per 100 words (aim under 5)`,m.fillers_per_100w>=5)+tile(m.mid_sentence_pauses,"pauses mid-sentence",m.mid_sentence_pauses>0)+
  tile(m.pauses_0_7s,"pauses over 0.7 s",m.pauses_0_7s>m.words/12)+tile(m.pauses_2s,"pauses over 2 s",m.pauses_2s>0)+tile(m.cutoffs,"cut-off words",m.cutoffs>1);
 $("note").textContent=Object.keys(fw).length?"Fillers: "+Object.entries(fw).map(([k,v])=>`"${k}" ×${v}`).join(", ")+".":"";
 $("statbox").hidden=false;
}
</script></body></html>
