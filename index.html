<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>talkTalk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Dashboard: search + session list, and the onboarding form for a new session. Same tokens as rehearse.html */
:root{--bg:#f7f6f3;--fg:#1d1c1a;--mute:#6b6862;--line:#dcd8d0;--card:#fff;--air:#c62828;
--q:"Source Serif 4",Georgia,serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#171615;--fg:#f1efea;--mute:#a7a39b;--line:#34322e;--card:#211f1d;--air:#ff5a4f;color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font:19px/1.5 var(--body);margin:0}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;display:grid;gap:20px}
h1{font:600 40px/1.2 var(--q);margin:0}h2{font:600 26px/1.3 var(--q);margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input,textarea,select{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 14px;box-sizing:border-box;width:100%}
textarea{min-height:5em;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--air);outline-offset:2px}
button{font:700 18px var(--body);padding:10px 20px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.primary{background:var(--air);border-color:var(--air);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
label{display:grid;gap:4px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);flex:1;min-width:180px}
label input,label textarea,label select{text-transform:none;letter-spacing:0;color:var(--fg);font-size:19px}
.mute{color:var(--mute);font-size:16px}
.sess{display:flex;gap:12px;align-items:center}
.sess:hover{border-color:var(--air)}
.sess a{flex:1;min-width:0;text-decoration:none;color:inherit}
.sess b{font:600 24px/1.3 var(--q)}
.qrow{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:grid;gap:8px}
.err{color:var(--air)}
</style></head><body>
<div class="wrap">
 <div class="row" style="justify-content:space-between"><h1>talkTalk</h1><button class="primary" id="new">+ New session</button></div>

 <form class="box" id="form" hidden>
  <h2 id="ftitle">New session</h2>
  <div class="row">
   <label>Topic<input id="topic" required placeholder="What the interview is about"></label>
   <label>Name<input id="name" required></label>
   <label style="flex:0 1 200px">Date<input id="date" type="date" required></label>
  </div>
  <p class="mute">Session ID: <b id="sid">—</b></p>
  <div id="qpart">
   <label>Import questions from a file<select id="src"></select></label>
   <p class="mute" id="srchint"></p>
  </div>
  <p class="mute" id="renum" hidden>Takes are filed by question number, so removing or adding a question in the middle shifts the numbers for earlier takes. Editing a question's text in place is safe.</p>
  <div id="qs"></div>
  <div class="row" style="margin-top:14px"><button type="button" id="addq">+ Add question</button><span style="flex:1"></span>
   <button type="button" id="cancel">Cancel</button><button class="primary" type="submit" id="submit">Create and rehearse</button></div>
  <p class="err" id="ferr"></p>
 </form>

 <input id="search" type="search" placeholder="Search by topic, name or session ID" aria-label="Search sessions">
 <div id="list" style="display:grid;gap:12px"><p class="mute">Loading…</p></div>
</div>
<script>
const $=id=>document.getElementById(id);let S=[],editing=null;
const word=t=>((t.trim().split(/\s+/)[0]||"").replace(/[^A-Za-z0-9]/g,"")||"Session");
const nextId=t=>{const w=word(t);return w+"-"+(1+Math.max(0,...S.map(x=>x.id).filter(x=>x.startsWith(w+"-")).map(x=>+x.split("-").pop())))};
const el=(tag,props,...kids)=>{const e=Object.assign(document.createElement(tag),props);e.append(...kids);return e};

function render(){
 const f=$("search").value.trim().toLowerCase(),hits=S.filter(x=>!f||[x.topic,x.name,x.id].join(" ").toLowerCase().includes(f));
 $("list").replaceChildren(...(hits.length?hits.map(x=>{const ed=el("button",{type:"button",textContent:"Edit"});ed.onclick=()=>edit(x);
  return el("div",{className:"box sess"},el("a",{href:"rehearse.html?s="+encodeURIComponent(x.id)},
  el("b",{},x.topic),el("div",{className:"mute"},`${x.id} · ${x.name} · ${x.date} · ${x.questions.length} questions · ${x.takes} takes`),
  ),ed)}):
  [el("p",{className:"mute"},S.length?"No session matches.":"No sessions yet. Start one with + New session.")]));
}
fetch("/api/sessions").then(r=>r.json()).then(d=>{S=d;render()});
$("search").oninput=render;

function addQ(x={q:"",a:""},focus=true){
 const n=$("qs").children.length+1,rm=el("button",{type:"button",textContent:"Remove"});
 const row=el("div",{className:"qrow"},el("label",{},`Question ${n}`,el("textarea",{className:"q",required:n===1,rows:2,value:x.q})),
  el("label",{},"Your notes (optional, for you only; not sent to the grader)",el("textarea",{className:"a",value:x.a})),el("div",{},rm));
 rm.onclick=()=>{row.remove();[...$("qs").children].forEach((r,k)=>r.querySelector("label").firstChild.textContent=`Question ${k+1}`)};
 $("qs").append(row);if(focus)row.querySelector("textarea").focus();
}
function loadFiles(){fetch("/api/files").then(r=>r.json()).then(d=>{
 $("src").replaceChildren(el("option",{value:"",textContent:d.files.length?"Choose a file…":"No files in the folder"}),...d.files.map(f=>el("option",{value:f,textContent:f})));
 $("srchint").textContent=`Put a questionnaire (.txt, .md, .docx, .rtf, …) in ${d.dir} and it appears here. Each question must be on its own line and end with "?"; the lines after it become your notes. The file moves into the session's folder when you create it.`})}
$("src").onchange=()=>{const f=$("src").value;if(!f)return;$("ferr").textContent="";
 fetch("/api/parse?f="+encodeURIComponent(f)).then(r=>r.json()).then(d=>{if(d.error){$("ferr").textContent=d.error;return}
  $("qs").replaceChildren();d.forEach(x=>addQ(x,false));if(!$("topic").value)$("topic").focus()})};
function mode(sess){editing=sess;$("ftitle").textContent=sess?"Edit session":"New session";$("submit").textContent=sess?"Save":"Create and rehearse";
 $("qpart").hidden=!!sess;$("renum").hidden=!sess;$("ferr").textContent="";$("form").hidden=false;$("form").scrollIntoView()}
function edit(x){mode(x);for(const k of ["topic","name","date"])$(k).value=x[k]||"";$("qs").replaceChildren();x.questions.forEach(q=>addQ(q,false));$("sid").textContent=x.id+" (stays the same)";$("topic").focus()}
$("new").onclick=()=>{if(editing){for(const k of ["topic","name","date"])$(k).value="";$("qs").replaceChildren()}mode(null);$("sid").textContent="—";loadFiles();$("date").value||=new Date().toISOString().slice(0,10);if(!$("qs").children.length)addQ();$("topic").focus()};
$("cancel").onclick=()=>{$("form").hidden=true;if(editing){editing=null;for(const k of ["topic","name","date"])$(k).value="";$("qs").replaceChildren()}};
$("addq").onclick=addQ;
$("topic").oninput=()=>editing||($("sid").textContent=$("topic").value.trim()?nextId($("topic").value):"—");
$("form").onsubmit=e=>{e.preventDefault();$("ferr").textContent="";
 const det={topic:$("topic").value,name:$("name").value,date:$("date").value};
 const questions=[...$("qs").children].map(r=>({q:r.querySelector(".q").value,a:r.querySelector(".a").value})).filter(x=>x.q.trim());
 if(editing)return fetch("/api/session?s="+encodeURIComponent(editing.id),{method:"POST",body:JSON.stringify({...det,questions})}).then(r=>r.json())
  .then(d=>{if(d.error)return $("ferr").textContent=d.error;Object.assign(editing,d);editing=null;$("form").hidden=true;$("qs").replaceChildren();render()})
  .catch(()=>$("ferr").textContent="Couldn't reach the server.");
 fetch("/api/sessions",{method:"POST",body:JSON.stringify({...det,questions,source:$("src").value})})
  .then(r=>r.json()).then(d=>d.error?$("ferr").textContent=d.error:location.href="rehearse.html?s="+encodeURIComponent(d.id))
  .catch(()=>$("ferr").textContent="Couldn't reach the server.")};
</script></body></html>
